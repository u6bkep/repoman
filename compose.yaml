services:
  repoman:
    build: .
    ports:
      - "8088:8080"
    userns_mode: keep-id
    security_opt:
      - label=disable
      - seccomp=unconfined
    devices:
      - /dev/fuse
    volumes:
      - /media/b-srv0/data/aur/data:/data
      - /media/b-srv0/data/aur:/srv/repo/aur
      - /media/b-srv0/data/aur/cache/aur-clones:/var/cache/repoman/aur
      - /media/b-srv0/data/aur/cache/pacman:/var/cache/repoman/pacman
      - /media/b-srv0/data/aur/cache/sources:/var/cache/repoman/sources
      - /media/b-srv0/data/aur/logs:/var/log/repoman
      - /media/b-srv0/data/aur/podman-storage:/home/repoman/.local/share/containers
    restart: unless-stopped
