[workspace]
members = ["crates/common", "crates/alpm", "crates/gate", "crates/store", "crates/coordinator", "crates/worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[package]
name = "repoman"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Builds AUR packages in isolated roots and publishes signed pacman repos"

[[bin]]
name = "repoman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
repoman-common = { path = "crates/common" }
repoman-coordinator = { path = "crates/coordinator" }
repoman-worker = { path = "crates/worker" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8.9"
repoman-alpm = { path = "crates/alpm" }
repoman-store = { path = "crates/store" }
tar = "0.4.46"
tempfile = "3.27.0"
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["fs"] }
zstd = "0.14.3"
