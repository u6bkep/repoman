# Coordinator stack for the NAS (b-srv0). Lives at /containers/repoman per
# that host's conventions: the stack dir holds this file, the config, and a
# rsync'd copy of the source under ./src for the image build. The SQLite
# database is bind-mounted from the SSD at /srv/db/repoman/coordinator.
#
#   rsync -a --delete --exclude target --exclude .git <repo>/ /containers/repoman/src/
#   docker compose up -d --build
#
# The container joins the docker1 macvlan and is reachable on the LAN as
# repoman.b.intern.gecko.network:7800 with no port publishing.

services:
  coordinator:
    build:
      context: ./src
      dockerfile: deploy/Dockerfile
    image: repoman:v2
    container_name: repoman
    hostname: repoman
    labels:
      coredns.dockerdiscovery.network: "docker1"
    networks:
      lan:
    restart: unless-stopped
    volumes:
      - ./coordinator.toml:/etc/repoman/coordinator.toml:ro
      - /srv/db/repoman/coordinator:/var/lib/repoman
      - /media/data/repoman:/var/lib/repoman/bulk
    environment:
      RUST_LOG: info
      # Claude API key for the reviewer; put ANTHROPIC_API_KEY=... in a
      # mode-0600 .env file next to this compose file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

networks:
  lan:
    name: docker1
    external: true
