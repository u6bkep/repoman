# repoman coordinator configuration.
# Runs on the NAS. data_dir holds SQLite and GPG homes (SSD); bulk_dir holds
# the artifact store, repos, images, staging, sync databases, and AUR clones.

listen = "0.0.0.0:7800"
# How workers and build roots reach this coordinator.
public_url = "http://repoman.b.intern.gecko.network:7800"
data_dir = "/var/lib/repoman"
bulk_dir = "/var/lib/repoman/bulk"
orphan_grace_secs = 120
arch = "x86_64"
image_packages = ["base", "base-devel"]
image_max_age_secs = 86400
# Set after `repoman keygen`; publishing is unsigned until then.
# signing_key = "FINGERPRINT"

# Gate: routine and metadata-only updates with a low floor risk approve
# themselves once the AUR has shown the commit for this many days.
quarantine_days = 3
auto_approve = true
auto_approve_metadata = true

# Scheduling: a build's cgroup memory limit is predicted from its recorded
# peaks (largest peak x headroom), or the default for a first build; a retry
# after an OOM kill doubles it. Workers admit jobs by predicted memory.
default_build_memory_bytes = 4294967296
build_memory_headroom = 1.5

# aur-security.cretezy.com assessments become signals on candidates; a
# dangerous or suspicious verdict blocks auto-approval. Unset to disable.
aur_security_url = "https://aur-security.cretezy.com"

# When an orphaned package gets a maintainer, nothing of theirs is
# auto-approved for this many days (an `adopted` signal that expires).
# Deleted/resubmitted bases and replaced git histories block until cleared.
adoption_quarantine_days = 30

# The aur-requests mailing list (RSS of the archive). Deletion and merge
# requests against tracked packages block auto-approval until a Package
# Maintainer rejects them or you clear them; orphan and adoption requests are
# recorded as context. Read at every run and every aur_requests_poll_secs.
aur_requests_url = "https://lists.archlinux.org/archives/list/aur-requests@lists.archlinux.org/feed/"
aur_requests_poll_secs = 1800

# aur-general discussion: messages naming a tracked package become info
# signals (context for the reviewer, never blocking). Same poll interval.
aur_general_url = "https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/feed/"

# The AUR website, read once per LLM review for the package's comments.
aur_web_url = "https://aur.archlinux.org"

# Pull-through cache for upstream packages at /cache (pacman CacheServer).
# Build roots use it automatically; clients add a CacheServer line.
cache_enabled = true
cache_grace_days = 30
# cache_max_bytes = 107374182400

# Routine updates are checked against GitHub/GitLab/Codeberg: the tag must
# exist under the baseline's owner. GITHUB_TOKEN in the environment raises
# the rate limit.
forge_checks = true

# Claude API reviewer for structural and elevated-risk candidates. The key
# comes from the environment (ANTHROPIC_API_KEY). Its risk can raise a
# candidate's risk, never lower it. Set routine_model to also review routine
# changes (costs a call per update).
[reviewer]
enabled = false
model = "claude-opus-5-5"
# routine_model = "claude-sonnet-5-5"
effort = "high"

[[workers]]
name = "b-dtop"
token = "replace-with-a-long-random-string"

# Streams, most conservative first. `server` is a pacman Server template.
[[streams]]
name = "manjaro-stable"
sort_order = 0
server = "https://cofractal-ewr.mm.fcix.net/manjaro/stable/$repo/$arch"
repos = ["core", "extra", "multilib"]
keyrings = ["archlinux", "manjaro"]

[[streams]]
name = "manjaro-unstable"
sort_order = 1
server = "https://cofractal-ewr.mm.fcix.net/manjaro/unstable/$repo/$arch"
repos = ["core", "extra", "multilib"]
keyrings = ["archlinux", "manjaro"]
